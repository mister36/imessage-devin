[project]
name = "devin-imessage"
version = "0.1.0"
description = "HTTP MCP server exposing iMessage (via BlueBubbles) to remote MCP clients like Devin"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2.0",
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.scripts]
devin-imessage = "devin_imessage.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devin_imessage"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
